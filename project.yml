name: Eugenia
options:
  bundleIdPrefix: com.eugenia
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"          # ver README: se sube a 6 cuando el primer build esté verde
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

# Única dependencia externa: FluidAudio (Apache 2.0) para separar hablantes en el
# Neural Engine (plan 5.3). Anclada al COMMIT de la etiqueta v0.15.7, no a la
# etiqueta: una etiqueta se puede mover (revisión de supply chain 2026-09-18). Sin
# telemetría; sus modelos van DENTRO de la app (scripts/fetch-diarizer-models.sh).
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    revision: 41540ea237350afe5117a082b5c28eda642d0612   # v0.15.7

schemes:
  Eugenia:
    build:
      targets:
        Eugenia: all
        EugeniaTests: [test]
        EugeniaUITests: [test]
    test:
      targets: [EugeniaTests, EugeniaUITests]
      gatherCoverageData: false

targets:
  Eugenia:
    type: application
    platform: iOS
    sources:
      - path: Eugenia
      - path: Shared
      # Modelos de hablantes, verificados por SHA-256 (fetch-diarizer-models.sh). Como
      # carpeta tal cual: los .mlmodelc ya vienen compilados.
      - path: DiarizerModels
        type: folder
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - target: EugeniaWidgets
        embed: true
    info:
      path: Eugenia/Resources/Info.plist
      properties:
        CFBundleDisplayName: Eugenia
        # EL IDIOMA DEL BUNDLE NO ES COSMÉTICA. `Locale.current` se resuelve contra las
        # localizaciones que declara el Info.plist, no contra Ajustes: sin estas dos
        # claves el bundle valía `en` y en un iPhone en español la app habría pedido el
        # modelo de voz INGLÉS para una reunión en español, y habría pintado las fechas
        # en inglés. Se vio en las capturas del simulador (01-06, run 34375999617).
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.eugenia.app.processing
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription:
          Eugenia usa Face ID para proteger tus reuniones si activas el bloqueo.
        NSCalendarsFullAccessUsageDescription:
          Eugenia lee tu calendario para poner título y asistentes a la reunión que estás grabando y avisarte antes de las próximas. No se envía a ningún sitio.
        # "Abrir en Eugenia" desde Archivos, Mail o WhatsApp (plan, Fase 3).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mpeg-4-audio, public.mp3, com.microsoft.waveform-audio]
          - CFBundleTypeName: Vídeo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie]
          - CFBundleTypeName: Documento
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.plain-text]
        NSMicrophoneUsageDescription:
          Eugenia graba el audio de tus reuniones para transcribirlo y resumirlo. Todo
          el procesamiento ocurre en este iPhone y el audio no sale del dispositivo.
        NSSpeechRecognitionUsageDescription:
          La transcripción se hace en el dispositivo con los modelos de voz de iOS.
        # Solo Debug: expone Documents/ por AFC para el banco de pruebas (plan 6.5).
        # En Release vale NO y la carpeta no es accesible ni por Archivos ni por AFC.
        UIFileSharingEnabled: $(EUGENIA_FILE_SHARING)
        LSSupportsOpeningDocumentsInPlace: $(EUGENIA_FILE_SHARING)
    entitlements:
      path: Eugenia/Resources/Eugenia.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenia.app
        GENERATE_INFOPLIST_FILE: NO
        # Icono: Resources/Assets.xcassets/AppIcon (lo genera scripts/make-icon.py).
        # actool mete CFBundleIcons en el Info.plist aunque éste no sea generado.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          EUGENIA_FILE_SHARING: "YES"
          # La forma idiomática de definir DEBUG para `#if DEBUG`. Con
          # OTHER_SWIFT_FLAGS: "-D DEBUG" el flag se parte en dos argumentos y hay
          # versiones de xcodebuild donde no llega bien — y si no llega, la app se
          # compila SIN el DiagnosticsRunner y el banco de pruebas no arranca nunca.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          EUGENIA_FILE_SHARING: "NO"

  # Live Activity + Dynamic Island + control del Centro de Control (plan, Fase 4).
  # Sin App Groups (exigen cuenta de pago): todo lo que muestra le llega en el estado
  # de la actividad. Con Apple ID gratuito cuenta como un App ID más en SideStore.
  EugeniaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Eugenia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenia.app.widgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: EUGENIA_WIDGET
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG EUGENIA_WIDGET

  # Pruebas unitarias de la lógica pura. Corren en el SIMULADOR, sin teléfono y sin
  # Apple Intelligence, y cubren lo que no depende del hardware: el cálculo de WER,
  # el troceado del map-reduce, el contrato JSON con devtest.sh y la persistencia.
  EugeniaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Eugenia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenia.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # Pruebas de INTERFAZ. Arrancan la app de verdad en el simulador, la pulsan y dejan
  # capturas como adjuntos del resultado. Cubren el hueco entre "compila" y "se puede
  # usar", y son la única forma de ver la app sin un Mac y sin el iPhone.
  EugeniaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Eugenia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenia.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Eugenia
