name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Repositorio PRIVADO: los minutos de macOS cuentan x10 contra los 2.000 del plan
# Free, o sea ~200 min reales al mes (plan 6.3). Por eso no se compila en cada push
# de cualquier rama. En repositorio público esto es gratis e ilimitado y se puede
# ampliar el disparador sin pensarlo.

# Mínimo privilegio para el GITHUB_TOKEN. Por defecto el token del workflow tiene
# permisos amplios sobre el repositorio; aquí solo hace falta leer el código y, al
# publicar una Release desde un tag, escribir contenido. Si una acción de terceros
# resultara comprometida, esto acota lo que podría hacer con el token.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # macos-26, NO macos-15. El primer intento falló con "no such module
    # 'FoundationModels'": la imagen macos-15 trae un Xcode cuyo SDK es iOS 18, y
    # FoundationModels y SpeechAnalyzer solo existen a partir del SDK de iOS 26.
    # macos-26 (GA desde febrero de 2026, Apple M4) trae Xcode 26.4.1 por defecto.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Diagnóstico barato que se queda para siempre: cuando un build falle por el
      # SDK, esta salida dice en dos segundos si el problema es la imagen o el código.
      - name: Xcode y SDKs disponibles
        run: |
          xcodebuild -version
          echo "---"
          ls /Applications | grep -i '^Xcode' || true
          echo "---"
          xcodebuild -showsdks | grep -iE 'ios|simulator' || true

      # Falla ANTES de compilar si se ha colado un entitlement que la firma
      # gratuita no admite. Sin esto el fallo aparece al instalar en el teléfono,
      # que es tarde y confuso (plan 6.2).
      - name: Comprobar entitlements
        run: python3 scripts/check-entitlements.py

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Cache de DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: dd-${{ runner.os }}-${{ hashFiles('project.yml', 'Eugenia/**/*.swift') }}
          restore-keys: dd-${{ runner.os }}-

      - name: Compilar sin firmar
        run: |
          set -o pipefail
          xcodebuild \
            -project Eugenia.xcodeproj \
            -scheme Eugenia \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_DEBUG_DYLIB=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            build

      - name: Empaquetar el .ipa
        run: |
          APP="build/Build/Products/Debug-iphoneos/Eugenia.app"
          test -d "$APP" || { echo "No se generó $APP"; exit 1; }
          # Con ENABLE_DEBUG_DYLIB=NO el código debe estar en el binario principal.
          # Si el ejecutable sale de unos pocos KB es que Xcode volvió a partirlo en
          # un .debug.dylib, y eso complica la firma en el teléfono.
          SIZE=$(stat -f%z "$APP/Eugenia")
          echo "tamaño del ejecutable: $SIZE bytes"
          if [ "$SIZE" -lt 200000 ]; then
            echo "El ejecutable es sospechosamente pequeño: ¿sigue activo el debug dylib?"
            ls -la "$APP"
            exit 1
          fi
          # El commit viaja dentro de la app: el informe de diagnóstico lo incluye,
          # así que un fallo siempre se puede atribuir a una versión concreta.
          /usr/libexec/PlistBuddy -c "Add :EugeniaCommit string ${GITHUB_SHA}" "$APP/Info.plist" || \
          /usr/libexec/PlistBuddy -c "Set :EugeniaCommit ${GITHUB_SHA}" "$APP/Info.plist"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Eugenia.ipa Payload
          ls -lh Eugenia.ipa

      # Sin el dSYM no se pueden simbolicar los crashes desde Linux, y el canal de
      # "autopsia" del plan 6.5 deja de existir. Por eso esto FALLA si no aparece, en
      # vez de seguir en silencio: la primera versión usaba `if [ -d ]` y el dSYM no
      # se generaba (Debug usa `dwarf` a secas, sin dSYM), así que el build salía
      # verde sin él y nadie se enteraba hasta el primer crash.
      - name: Empaquetar el dSYM
        run: |
          DSYM=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name "*.dSYM" | head -1)
          if [ -z "$DSYM" ]; then
            echo "No se generó ningún dSYM. Sin él no hay simbolicación de crashes (plan 6.5)."
            exit 1
          fi
          echo "dSYM: $DSYM"
          zip -qry Eugenia.dSYM.zip "$DSYM"

      - uses: actions/upload-artifact@v4
        with:
          name: eugenia-${{ github.sha }}
          path: |
            Eugenia.ipa
            Eugenia.dSYM.zip
          if-no-files-found: error

      # ACCIÓN DE TERCEROS. Está anclada a la etiqueta mayor `v2`, que es mutable:
      # quien controle el repositorio de la acción puede cambiar lo que ejecuta. Para
      # este proyecto (repo privado, un solo usuario, sin secretos más allá del token
      # ya acotado arriba) es un riesgo asumible, pero conviene saberlo. Si algún día
      # este repositorio guarda secretos, hay que anclarla a un SHA concreto.
      - name: Publicar Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Eugenia.ipa
            Eugenia.dSYM.zip
