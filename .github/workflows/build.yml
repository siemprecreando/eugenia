name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Repositorio PRIVADO: los minutos de macOS cuentan x10 contra los 2.000 del plan
# Free, o sea ~200 min reales al mes (plan 6.3). Por eso no se compila en cada push
# de cualquier rama. En repositorio público esto es gratis e ilimitado y se puede
# ampliar el disparador sin pensarlo.

# Mínimo privilegio para el GITHUB_TOKEN. Por defecto el token del workflow tiene
# permisos amplios sobre el repositorio; aquí solo hace falta leer el código y, al
# publicar una Release desde un tag, escribir contenido. Si una acción de terceros
# resultara comprometida, esto acota lo que podría hacer con el token.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Todo lo que se puede comprobar SIN el iPhone. No sustituye al dispositivo —el
  # simulador no tiene Neural Engine, ni FoundationModels, ni modelos de voz reales—
  # pero sí caza lo que hoy es el riesgo número uno: que la app reviente al arrancar
  # o que la lógica pura esté mal. Plan, sección 6.5.
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Elegir simulador
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          best = None
          for runtime, devs in devices.items():
              if 'iOS' not in runtime:
                  continue
              for dev in devs:
                  if dev.get('isAvailable') and 'iPhone' in dev['name']:
                      best = (dev['udid'], dev['name'], runtime)
          if not best:
              raise SystemExit('No hay ningún simulador de iPhone disponible')
          print(best[0])
          import sys as s2
          print(f'{best[1]} · {best[2]}', file=s2.stderr)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "simulador: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Pruebas unitarias
        run: |
          set -o pipefail
          xcodebuild test \
            -project Eugenia.xcodeproj \
            -scheme Eugenia \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -only-testing:EugeniaTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # Esto es el bucle de la sección 6.5 en seco: se empuja el plan de pruebas al
      # contenedor de la app, se lanza, y se recoge el informe. El contenedor de un
      # simulador es un directorio normal, así que hace de AFC. Si esto pasa, sabemos
      # que el DiagnosticsRunner arranca, escribe y serializa bien — que es la mitad
      # del spike 8, resuelta sin tocar el teléfono.
      - name: Bucle de diagnóstico contra el simulador
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build/Build/Products/Debug-iphonesimulator/Eugenia.app"
          test -d "$APP" || { echo "No se generó $APP"; exit 1; }

          xcrun simctl install "$UDID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.eugenia.app data)
          echo "contenedor: $CONTAINER"

          mkdir -p "$CONTAINER/Documents/diagnostics"
          cp suites/${SUITE:-smoke}.json "$CONTAINER/Documents/diagnostics/run.json"

          xcrun simctl launch "$UDID" com.eugenia.app

          REPORT=""
          for i in $(seq 1 40); do
            REPORT=$(find "$CONTAINER/Documents/diagnostics" -name "report-*.json" | head -1)
            [ -n "$REPORT" ] && break
            sleep 2
          done

          if [ -z "$REPORT" ]; then
            echo "La app no escribió ningún informe en 80 s."
            echo "--- log del simulador ---"
            xcrun simctl spawn "$UDID" log show --last 2m --predicate 'subsystem == "com.eugenia.app"' --style compact || true
            echo "--- crashes ---"
            ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "--- informe ---"
          cat "$REPORT"
          python3 - "$REPORT" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print()
          print("dispositivo:", d["run"]["device"], "· iOS", d["run"]["os"])
          print("IA:", d["env"]["modelAvailability"], "(en simulador se espera 'unavailable')")
          for c in d["cases"]:
              print(f"  [{c['status']}] {c['id']} — {c.get('message') or ''}")
          if d["summary"]["failed"]:
              raise SystemExit(f"{d['summary']['failed']} caso(s) fallidos")
          print("\nEl bucle Linux->app->informe funciona.")
          PY

      # Pruebas de interfaz + CAPTURAS. Arrancan la app, la pulsan y navegan. Cubren el
      # hueco entre "compila" y "se puede usar": un @EnvironmentObject que falta compila
      # perfectamente y tira la app en el primer render.
      #
      # Las capturas salen como adjuntos del .xcresult y se publican como artefacto, que
      # es la única manera de ver la interfaz sin un Mac y sin el iPhone.
      - name: Pruebas de interfaz y capturas
        id: ui
        run: |
          set -o pipefail
          rm -rf ui.xcresult capturas
          xcodebuild test \
            -project Eugenia.xcodeproj \
            -scheme Eugenia \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -only-testing:EugeniaUITests \
            -resultBundlePath ui.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # Se extraen SIEMPRE, también si la prueba falló: cuando falla, la captura del
      # momento del fallo es justo lo que hace falta para entenderlo desde Linux.
      - name: Extraer las capturas
        if: always()
        run: |
          [ -d ui.xcresult ] || { echo "no hay .xcresult"; exit 0; }
          mkdir -p capturas
          xcrun xcresulttool export attachments \
            --path ui.xcresult --output-path capturas >/dev/null 2>&1 || \
            echo "xcresulttool export attachments no funcionó; se pasa al plan B"

          python3 - <<'PYEOF'
          import json, pathlib, shutil
          out = pathlib.Path("capturas")
          manifest = out / "manifest.json"
          renombradas = 0
          if manifest.exists():
              data = json.loads(manifest.read_text())
              for entrada in (data if isinstance(data, list) else [data]):
                  for att in entrada.get("attachments", []):
                      origen = out / att.get("exportedFileName", "")
                      nombre = att.get("suggestedHumanReadableName") or origen.name
                      if origen.exists() and origen.name != nombre:
                          shutil.move(str(origen), str(out / nombre))
                          renombradas += 1
              manifest.unlink()
          print(f"capturas renombradas: {renombradas}")
          PYEOF

          # Plan B: si el exportador no dejó nada, se rastrean los PNG dentro del
          # bundle por su cabecera. Se pierden los nombres, pero se ve la app.
          if [ -z "$(ls -A capturas 2>/dev/null)" ]; then
            i=0
            while IFS= read -r f; do
              if [ "$(head -c 8 "$f" | xxd -p)" = "89504e470d0a1a0a" ]; then
                i=$((i+1)); cp "$f" "capturas/captura-$i.png"
              fi
            done < <(find ui.xcresult -type f)
            echo "plan B: $i PNG recuperados del bundle"
          fi

          echo "--- capturas ---"
          ls -la capturas
          # Si no hay ni una, algo se rompió en la cadena y hay que enterarse.
          test -n "$(ls -A capturas)" || { echo "No se recuperó ninguna captura"; exit 1; }

      - name: Publicar las capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ github.sha }}
          path: capturas
          if-no-files-found: warn

      # MEDIDO, NO SUPUESTO: en los runners de GitHub el modelo NO está disponible de
      # forma fiable. Dos ejecuciones seguidas dieron:
      #     run 34304939735 -> llm=available
      #     run 34305455877 -> llm=unavailable(modelNotReady)
      # Apple Intelligence no está provisionado en la imagen, y `.available` llegó a
      # aparecer antes de que el modelo estuviera listo. O sea que ese `.available`
      # era engañoso, no una buena noticia.
      #
      # Consecuencia: este paso normalmente se SALTA, y así debe ser. Se queda por dos
      # motivos: si algún día la imagen trae el modelo, esto lo detecta solo; y la
      # misma suite (suites/llm.json) es la que se lanza contra el iPhone con
      # `./scripts/devtest.sh llm`, donde el 17e sí tiene Apple Intelligence.
      #
      # El spike 4b del plan se mide en el teléfono. Aquí solo se intenta.
      - name: Resumen con el LLM — contexto cruzado temporal (oportunista)
        id: llm
        continue-on-error: true
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.eugenia.app data)
          rm -f "$CONTAINER"/Documents/diagnostics/report-*.json
          cp suites/llm.json "$CONTAINER/Documents/diagnostics/run.json"

          xcrun simctl terminate "$UDID" com.eugenia.app 2>/dev/null || true
          xcrun simctl launch "$UDID" com.eugenia.app

          REPORT=""
          for i in $(seq 1 90); do
            REPORT=$(find "$CONTAINER/Documents/diagnostics" -name "report-*.json" | head -1)
            [ -n "$REPORT" ] && break
            sleep 4
          done
          [ -n "$REPORT" ] || { echo "sin informe en 6 min"; exit 1; }

          cat "$REPORT"
          echo "--- resumen que produjo el modelo ---"
          cat "$CONTAINER"/Documents/diagnostics/*-summary.json 2>/dev/null || echo "(sin artefacto)"
          python3 - "$REPORT" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("\nIA:", d["env"]["modelAvailability"])
          for c in d["cases"]:
              print(f"  [{c['status']}] {c['id']} — {c.get('message') or ''}")
              for k, v in sorted(c["metrics"].items()):
                  print(f"        {k} = {v:.1f}")
          if d["summary"]["failed"]:
              raise SystemExit("el resumidor no cumplió los umbrales")
          PY

      - name: Traza estructurada de la app
        if: always()
        run: |
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 5m \
            --predicate 'subsystem == "com.eugenia.app"' --style compact || true

  ipa:
    # macos-26, NO macos-15. El primer intento falló con "no such module
    # 'FoundationModels'": la imagen macos-15 trae un Xcode cuyo SDK es iOS 18, y
    # FoundationModels y SpeechAnalyzer solo existen a partir del SDK de iOS 26.
    # macos-26 (GA desde febrero de 2026, Apple M4) trae Xcode 26.4.1 por defecto.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Diagnóstico barato que se queda para siempre: cuando un build falle por el
      # SDK, esta salida dice en dos segundos si el problema es la imagen o el código.
      - name: Xcode y SDKs disponibles
        run: |
          xcodebuild -version
          echo "---"
          ls /Applications | grep -i '^Xcode' || true
          echo "---"
          xcodebuild -showsdks | grep -iE 'ios|simulator' || true

      # Falla ANTES de compilar si se ha colado un entitlement que la firma
      # gratuita no admite. Sin esto el fallo aparece al instalar en el teléfono,
      # que es tarde y confuso (plan 6.2).
      - name: Comprobar entitlements
        run: python3 scripts/check-entitlements.py

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Cache de DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: dd-${{ runner.os }}-${{ hashFiles('project.yml', 'Eugenia/**/*.swift') }}
          restore-keys: dd-${{ runner.os }}-

      - name: Compilar sin firmar
        run: |
          set -o pipefail
          xcodebuild \
            -project Eugenia.xcodeproj \
            -scheme Eugenia \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_DEBUG_DYLIB=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            build

      - name: Empaquetar el .ipa
        run: |
          APP="build/Build/Products/Debug-iphoneos/Eugenia.app"
          test -d "$APP" || { echo "No se generó $APP"; exit 1; }
          # Con ENABLE_DEBUG_DYLIB=NO el código debe estar en el binario principal.
          # Si el ejecutable sale de unos pocos KB es que Xcode volvió a partirlo en
          # un .debug.dylib, y eso complica la firma en el teléfono.
          SIZE=$(stat -f%z "$APP/Eugenia")
          echo "tamaño del ejecutable: $SIZE bytes"
          if [ "$SIZE" -lt 200000 ]; then
            echo "El ejecutable es sospechosamente pequeño: ¿sigue activo el debug dylib?"
            ls -la "$APP"
            exit 1
          fi
          # El commit viaja dentro de la app: el informe de diagnóstico lo incluye,
          # así que un fallo siempre se puede atribuir a una versión concreta.
          /usr/libexec/PlistBuddy -c "Add :EugeniaCommit string ${GITHUB_SHA}" "$APP/Info.plist" || \
          /usr/libexec/PlistBuddy -c "Set :EugeniaCommit ${GITHUB_SHA}" "$APP/Info.plist"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Eugenia.ipa Payload
          ls -lh Eugenia.ipa

      # Sin el dSYM no se pueden simbolicar los crashes desde Linux, y el canal de
      # "autopsia" del plan 6.5 deja de existir. Por eso esto FALLA si no aparece, en
      # vez de seguir en silencio: la primera versión usaba `if [ -d ]` y el dSYM no
      # se generaba (Debug usa `dwarf` a secas, sin dSYM), así que el build salía
      # verde sin él y nadie se enteraba hasta el primer crash.
      - name: Empaquetar el dSYM
        run: |
          DSYM=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name "*.dSYM" | head -1)
          if [ -z "$DSYM" ]; then
            echo "No se generó ningún dSYM. Sin él no hay simbolicación de crashes (plan 6.5)."
            exit 1
          fi
          echo "dSYM: $DSYM"
          zip -qry Eugenia.dSYM.zip "$DSYM"

      - uses: actions/upload-artifact@v4
        with:
          name: eugenia-${{ github.sha }}
          path: |
            Eugenia.ipa
            Eugenia.dSYM.zip
          if-no-files-found: error

      # ACCIÓN DE TERCEROS. Está anclada a la etiqueta mayor `v2`, que es mutable:
      # quien controle el repositorio de la acción puede cambiar lo que ejecuta. Para
      # este proyecto (repo privado, un solo usuario, sin secretos más allá del token
      # ya acotado arriba) es un riesgo asumible, pero conviene saberlo. Si algún día
      # este repositorio guarda secretos, hay que anclarla a un SHA concreto.
      - name: Publicar Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Eugenia.ipa
            Eugenia.dSYM.zip
